<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio Grata</title>
  <meta name="description" content="Studio Grata is a Bengaluru based interior architecture studio designing hospitality, F&amp;B, retail and wellness spaces across India.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Studio Grata">
  <meta property="og:title" content="Studio Grata | Interior architecture, Bengaluru">
  <meta property="og:description" content="Interior architecture for hospitality, food and drink, retail and wellness. Based in Bengaluru.">
  <meta property="og:url" content="https://studiograta.in/">
  <meta property="og:image" content="https://studiograta.in/images/share/studio-grata.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Go Native, Koramangala: a bamboo-roofed terrace dining room with globe lights and planters">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Remove the next line when the full site is ready, so search engines can list it -->
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600&family=Jost:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preload" as="image" href="/images/work/work-1.webp">
  <link rel="preload" as="image" href="/images/studio/tiles-light.jpg">
</head>
<body>
  <main class="landing">

    <!-- Logo: the image lives in images/logo.png, its colour is set in styles.css -->
    <a class="wordmark" href="/" aria-label="Studio Grata home"></a>

    <!-- WORK PANEL -->
    <section class="panel panel--work" aria-label="Work">
      <!-- Photos: they fade from one to the next. Add or remove lines to
           change the set (main.js loads them). On phones each one moves
           while shown; data-move picks how, to suit the photo: right or
           left (wide photos: the view drifts that way, so end on the best
           part), zoom-in or zoom-out (upright photos that already fill the
           width). Without data-move it drifts right. -->
      <div class="photos" aria-hidden="true">
        <img class="photo is-shown" data-src="/images/work/work-1.webp" data-move="right" alt="">
        <img class="photo" data-src="/images/work/work-3.webp" data-move="left" alt="">
        <img class="photo" data-src="/images/work/work-5.webp" data-move="right" alt="">
        <img class="photo" data-src="/images/work/work-6.webp?v=2" data-move="right" alt="">
        <img class="photo" data-src="/images/work/work-7.webp" data-move="right" alt="">
        <img class="photo" data-src="/images/work/work-8.webp" data-move="left" alt="">
        <img class="photo" data-src="/images/work/sohum-reception.webp" data-move="left" alt="">
      </div>
      <div class="panel__inner">
        <button class="panel__toggle" type="button" aria-expanded="false">
          Work
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <!-- Sectors: each opens the Work page with that filter on.
             "all" is for phones, where tapping Work opens this list. -->
        <nav class="panel__links" aria-label="Work">
          <a class="phone-only" href="/work">all</a>
          <a href="/work#hospitality">hospitality</a>
          <a href="/work#fnb">f&amp;b</a>
          <a href="/work#wellness">wellness</a>
          <!-- retail: add back with the first retail project, like on /work
          <a href="/work#retail">retail</a> -->
        </nav>
      </div>
    </section>

    <!-- STUDIO PANEL -->
    <section class="panel panel--studio" aria-label="Studio">
      <!-- Photos: same as the Work panel above, including data-move -->
      <div class="photos" aria-hidden="true">
        <img class="photo is-shown" data-src="/images/studio/tiles-light.jpg" data-move="zoom-out" style="object-position: 50% 58%" alt="">
        <img class="photo" data-src="/images/studio/swatches.jpg" data-move="right" style="object-position: 55% 50%" alt="">
        <img class="photo" data-src="/images/studio/wood-samples.jpg" data-move="zoom-in" style="object-position: 50% 60%" alt="">
      </div>
      <div class="panel__inner">
        <button class="panel__toggle" type="button" aria-expanded="false">
          Studio
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <!-- "about" opens the Studio page, for phones; called about so the
             list does not say Studio twice -->
        <nav class="panel__links" aria-label="Studio">
          <a class="phone-only" href="/studio">about</a>
          <a href="/journal/">journal</a>
          <a href="/partners">partners</a>
          <a href="/culture">culture</a>
          <a href="/connect">connect</a>
        </nav>
      </div>
    </section>

  </main>
  <script src="/main.js"></script>
</body>
</html>
