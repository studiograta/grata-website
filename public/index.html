<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio Grata</title>
  <meta name="description" content="Studio Grata is a Bengaluru based interior architecture studio designing hospitality, F&amp;B, retail and wellness spaces across India.">
  <!-- Remove the next line when the full site is ready, so search engines can list it -->
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="landing">

    <!-- Logo: the image lives in images/logo.png, its colour is set in styles.css -->
    <a class="wordmark" href="/" aria-label="Studio Grata home"></a>

    <!-- WORK PANEL -->
    <section class="panel panel--work" aria-label="Work">
      <div class="photos" aria-hidden="true">
        <!-- Project photos: they fade from one to the next, and the caption shows the project name.
             Desktop photos are 3:2; the phone version (screens 760px wide or less) is a separate 2:3 photo. -->
        <picture>
          <source media="(max-width: 760px)" srcset="/images/work/prayag-reading-nook-mobile.jpg">
          <img class="photo is-shown" src="/images/work/prayag-play-area.jpg" data-caption="Prayag Montessori" alt="">
        </picture>
        <picture>
          <source media="(max-width: 760px)" data-srcset="/images/work/go-native-pergola-mobile.jpg">
          <img class="photo" data-src="/images/work/go-native-pergola.jpg" data-caption="Go Native" alt="">
        </picture>
        <picture>
          <source media="(max-width: 760px)" data-srcset="/images/work/prayag-corridor-mobile.jpg">
          <img class="photo" data-src="/images/work/prayag-outdoor-classroom.jpg" data-caption="Prayag Montessori" alt="">
        </picture>
        <picture>
          <source media="(max-width: 760px)" data-srcset="/images/work/go-native-banquette-mobile.jpg">
          <img class="photo" data-src="/images/work/go-native-pergola-doors.jpg" data-caption="Go Native" alt="">
        </picture>
        <picture>
          <source media="(max-width: 760px)" data-srcset="/images/work/prayag-mud-kitchen-mobile.jpg">
          <img class="photo" data-src="/images/work/prayag-mural-classroom.jpg" data-caption="Prayag Montessori" alt="">
        </picture>
        <picture>
          <source media="(max-width: 760px)" data-srcset="/images/work/go-native-signage-mobile.jpg">
          <img class="photo" data-src="/images/work/go-native-stone-court.jpg" data-caption="Go Native" alt="">
        </picture>
      </div>
      <p class="photo-caption" aria-hidden="true">Prayag Montessori</p>
      <div class="panel__inner">
        <a class="panel__toggle" href="/work">Work</a>
      </div>
    </section>

    <!-- STUDIO PANEL -->
    <section class="panel panel--studio" aria-label="Studio">
      <div class="photos" aria-hidden="true">
        <!-- Resting photos: they fade from one to the next. Desktop photos are 5:4;
             the phone version (screens 760px wide or less) is a separate 4:5 photo. -->
        <picture>
          <source media="(max-width: 760px)" srcset="/images/studio/tables-mobile.jpg">
          <img class="photo is-shown" src="/images/studio/panels.jpg" alt="">
        </picture>
        <picture>
          <source media="(max-width: 760px)" data-srcset="/images/studio/thali-mobile.jpg">
          <img class="photo" data-src="/images/studio/glass-roof-bw.jpg" alt="">
        </picture>
        <picture>
          <source media="(max-width: 760px)" data-srcset="/images/studio/white-panels-mobile.jpg">
          <img class="photo" data-src="/images/studio/glass-roof-reflection.jpg" alt="">
        </picture>
        <picture>
          <source media="(max-width: 760px)" data-srcset="/images/studio/menu-detail-mobile.jpg">
          <img class="photo" data-src="/images/studio/lamp.jpg" alt="">
        </picture>
        <!-- Link photos: shown while hovering the link with the matching data-tone -->
        <img class="photo" data-for="working" src="/images/studio/sketch.jpg" alt="">
        <img class="photo" data-for="partners" src="/images/studio/swatches.jpg" alt="">
        <img class="photo" data-for="contact" src="/images/studio/desk.jpg" alt="">
      </div>
      <div class="panel__inner">
        <button class="panel__toggle" type="button" aria-expanded="false">
          Studio
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <nav class="panel__links" aria-label="Studio">
          <a href="/working-with-us" data-tone="working">Process</a>
          <a href="/partners" data-tone="partners">Partners</a>
          <a href="/contact" data-tone="contact">Contact</a>
        </nav>
      </div>
    </section>

  </main>
  <script src="/main.js"></script>
</body>
</html>
