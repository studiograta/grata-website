<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio Grata</title>
  <meta name="description" content="Studio Grata is a Bengaluru based interior architecture studio designing hospitality, F&amp;B, retail and wellness spaces across India.">
  <!-- Remove the next line when the full site is ready, so search engines can list it -->
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="landing">

    <!-- Logo: the image lives in images/logo.png, its colour is set in styles.css -->
    <a class="wordmark" href="/" aria-label="Studio Grata home"></a>

    <!-- WORK PANEL -->
    <section class="panel panel--work" aria-label="Work">
      <!-- Photos: they fade from one to the next. Add or remove lines to
           change the set (main.js loads them). On phones each one moves
           while shown; data-move picks how, to suit the photo: right or
           left (wide photos: the view drifts that way, so end on the best
           part), zoom-in or zoom-out (upright photos that already fill the
           width). Without data-move it drifts right. -->
      <div class="photos" aria-hidden="true">
        <img class="photo is-shown" data-src="/images/work/work-1.webp" data-move="right" alt="">
        <img class="photo" data-src="/images/work/work-4.webp" data-move="right" alt="">
        <img class="photo" data-src="/images/work/work-3.webp" data-move="left" alt="">
        <img class="photo" data-src="/images/work/work-5.webp" data-move="right" alt="">
        <img class="photo" data-src="/images/work/work-6.webp?v=2" data-move="right" alt="">
        <img class="photo" data-src="/images/work/work-7.webp" data-move="right" alt="">
        <img class="photo" data-src="/images/work/work-8.webp" data-move="left" alt="">
      </div>
      <div class="panel__inner">
        <button class="panel__toggle" type="button" aria-expanded="false">
          Work
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <!-- Sectors: each opens its part of the Work page -->
        <nav class="panel__links" aria-label="Work">
          <a href="/work#hospitality">hospitality</a>
          <a href="/work#fnb">f&amp;b</a>
          <a href="/work#wellness">wellness</a>
          <a href="/work#retail">retail</a>
        </nav>
      </div>
    </section>

    <!-- STUDIO PANEL -->
    <section class="panel panel--studio" aria-label="Studio">
      <!-- Photos: same as the Work panel above, including data-move -->
      <div class="photos" aria-hidden="true">
        <img class="photo is-shown" data-src="/images/studio/carpenter.jpg" data-move="zoom-in" alt="">
        <img class="photo" data-src="/images/studio/fabric-rolls.jpg" data-move="right" alt="">
        <img class="photo" data-src="/images/studio/boards.jpg" data-move="zoom-out" alt="">
      </div>
      <div class="panel__inner">
        <button class="panel__toggle" type="button" aria-expanded="false">
          Studio
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <nav class="panel__links" aria-label="Studio">
          <a href="/working-with-us" data-tone="working">approach</a>
          <a href="/partners" data-tone="partners">partners</a>
          <a href="/contact" data-tone="contact">connect</a>
        </nav>
      </div>
    </section>

  </main>
  <script src="/main.js"></script>
</body>
</html>
