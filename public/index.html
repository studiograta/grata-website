<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio Grata</title>
  <meta name="description" content="Studio Grata is a Bengaluru based interior architecture studio designing hospitality, F&amp;B, retail and wellness spaces across India.">
  <!-- Remove the next line when the full site is ready, so search engines can list it -->
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="landing">

    <!-- Logo: the image lives in images/logo.png, its colour is set in styles.css -->
    <a class="wordmark" href="/" aria-label="Studio Grata home"></a>

    <!-- WORK PANEL -->
    <section class="panel panel--work" aria-label="Work">
      <div class="photos" aria-hidden="true">
        <!-- Project photos: they fade from one to the next, and the caption shows the project name -->
        <img class="photo is-shown" src="/images/work/lotus-palace-courtyard.jpg" data-caption="Lotus Palace" alt="">
        <img class="photo" data-src="/images/work/vadhyar-house-entrance.jpg" data-caption="Vadhyar House" alt="">
        <img class="photo" data-src="/images/work/beruru-garden.jpg" data-caption="Beruru" alt="">
        <img class="photo" data-src="/images/work/go-native-dining.jpg" data-caption="Go Native" alt="">
        <img class="photo" data-src="/images/work/lotus-palace-lounge.jpg" data-caption="Lotus Palace" alt="">
        <img class="photo" data-src="/images/work/vadhyar-house-courtyard.jpg" data-caption="Vadhyar House" alt="">
        <img class="photo" data-src="/images/work/beruru-table.jpg" data-caption="Beruru" alt="">
        <img class="photo" data-src="/images/work/go-native-banquette.jpg" data-caption="Go Native" alt="">
      </div>
      <p class="photo-caption" aria-hidden="true">Lotus Palace</p>
      <div class="panel__inner">
        <a class="panel__toggle" href="/work">Work</a>
      </div>
    </section>

    <!-- STUDIO PANEL -->
    <section class="panel panel--studio" aria-label="Studio">
      <div class="photos" aria-hidden="true">
        <!-- Resting photos: they fade from one to the next. Add or remove lines to change the set. -->
        <img class="photo is-shown" src="/images/studio/suede.jpg" alt="">
        <img class="photo" data-src="/images/studio/knits.jpg" alt="">
        <img class="photo" data-src="/images/studio/sand.jpg" alt="">
        <img class="photo" data-src="/images/studio/sculpture.jpg" alt="">
        <img class="photo" data-src="/images/studio/colour.jpg" alt="">
        <img class="photo" data-src="/images/studio/pour.jpg" alt="">
        <!-- Link photos: shown while hovering the link with the matching data-tone -->
        <img class="photo" data-for="working" src="/images/studio/sketch.jpg" alt="">
        <img class="photo" data-for="partners" src="/images/studio/swatches.jpg" alt="">
        <img class="photo" data-for="contact" src="/images/studio/desk.jpg" alt="">
      </div>
      <div class="panel__inner">
        <button class="panel__toggle" type="button" aria-expanded="false">
          Studio
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <nav class="panel__links" aria-label="Studio">
          <a href="/working-with-us" data-tone="working">Process</a>
          <a href="/partners" data-tone="partners">Partners</a>
          <a href="/contact" data-tone="contact">Contact</a>
        </nav>
      </div>
    </section>

  </main>
  <script src="/main.js"></script>
</body>
</html>
