<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Work | Studio Grata</title>
  <meta name="description" content="Selected hospitality, F&amp;B, retail and wellness interiors by Studio Grata.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600&family=Josefin+Sans:wght@400;600&family=Kalam:wght@300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page wk pn" id="top">
    <a class="wordmark" href="/" aria-label="Studio Grata home"></a>

    <header class="wk__intro">
      <h1 data-titles>work</h1>
    </header>

    <nav class="wk__filter" aria-label="Filter projects">
      <a href="#" data-filter="all" aria-current="true">all</a>
      <a href="#hospitality" data-filter="hospitality">hospitality</a>
      <a href="#fnb" data-filter="fnb">f&amp;b</a>
      <a href="#wellness" data-filter="wellness">wellness</a>
      <a href="#retail" data-filter="retail">retail</a>
    </nav>

    <!-- One print per project, its hero photo. data-project is
         "Project : Place"; clicking a print opens every photo below with
         the same name, in the order listed. -->
    <div class="pn__board">
      <button class="pn__item" data-type="fnb" data-project="Go Native : Koramangala"><img src="/images/work/work-1.webp" width="1448" height="1086" alt="Yellow dining room with a bamboo ceiling"><span>Go Native : Koramangala</span></button>
      <button class="pn__item" data-type="hospitality" data-project="Lotus Palace : Chettinad"><img src="/images/work/work-8.webp" width="2000" height="1176" alt="Red lounge with carved wooden pillars"><span>Lotus Palace : Chettinad</span></button>
      <button class="pn__item" data-type="wellness" data-project="Sohum Spa"><img src="/images/work/sohum-reception.webp" width="2000" height="1327" alt="Spa reception with an apothecary shelf and lantern lamps"><span>Sohum Spa</span></button>
      <button class="pn__item" data-type="fnb" data-project="Vadhyar Palace"><img src="/images/work/work-5.webp" width="1491" height="1055" alt="Courtyard with a terracotta water bowl beside a heritage mansion"><span>Vadhyar Palace</span></button>
      <button class="pn__item" data-type="fnb" data-project="Alfresco Dining : Siliguri"><img src="/images/work/work-6.webp?v=2" width="2000" height="1500" alt="Alfresco dining under a steel pergola"><span>Alfresco Dining : Siliguri</span></button>
    </div>
    <div class="pn__photos" hidden>
      <img data-project="Go Native : Koramangala" loading="lazy" src="/images/work/work-1.webp" width="1448" height="1086" alt="Yellow dining room with a bamboo ceiling">
      <img data-project="Go Native : Koramangala" loading="lazy" src="/images/work/work-3.webp" width="1448" height="1086" alt="Banquette seating below a jaali wall">
      <img data-project="Lotus Palace : Chettinad" loading="lazy" src="/images/work/work-8.webp" width="2000" height="1176" alt="Red lounge with carved wooden pillars">
      <img data-project="Lotus Palace : Chettinad" loading="lazy" src="/images/work/work-7.webp" width="2000" height="1992" alt="Pool court under a slatted wooden pergola">
      <img data-project="Sohum Spa" loading="lazy" src="/images/work/sohum-reception.webp" width="2000" height="1327" alt="Spa reception with an apothecary shelf and lantern lamps">
      <img data-project="Sohum Spa" loading="lazy" src="/images/work/sohum-lounge.webp" width="1317" height="2000" alt="Relaxation lounge under painted ceiling panels">
      <img data-project="Sohum Spa" loading="lazy" src="/images/work/sohum-corridor.webp" width="2000" height="1383" alt="Corridor of wooden lattice screens and curtains">
      <img data-project="Sohum Spa" loading="lazy" src="/images/work/sohum-treatment.webp" width="2000" height="1300" alt="Treatment room with wooden shutters and a painted frieze">
      <img data-project="Vadhyar Palace" loading="lazy" src="/images/work/work-5.webp" width="1491" height="1055" alt="Courtyard with a terracotta water bowl beside a heritage mansion">
      <img data-project="Alfresco Dining : Siliguri" loading="lazy" src="/images/work/work-6.webp?v=2" width="2000" height="1500" alt="Alfresco dining under a steel pergola">
    </div>
    <p class="pn__hint">move the prints about · click one to open the project</p>

    <dialog class="pn__dialog" aria-labelledby="pn-title">
      <div class="pn__dialog-top">
        <div>
          <p class="pn__kicker"></p>
          <h2 id="pn-title"></h2>
        </div>
        <button class="pn__close" type="button">close</button>
      </div>
      <div class="pn__row"></div>
    </dialog>
  </main>
  <script src="/titles.js"></script>
  <script src="/work.js"></script>
</body>
</html>
