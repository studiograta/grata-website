          <!-- Registered office is a virtual address (Aspire Coworks, 17, 7th Main Road,
               Indiranagar II Stage, Bengaluru 560008), so only the area is shown -->
          <section>
            <h2>Based in</h2>
            <address>
              Indiranagar<br>

        </div>

        <!-- "Begin" opens the enquiry form. Web3Forms emails each enquiry to the address linked to the access key. -->
        <details class="connect__begin">
          <summary class="button">Begin a project &rarr;</summary>
          <form class="contact__form" method="post" action="https://api.web3forms.com/submit">
            <p class="connect__hint">Tell us about your space and we will get back to you.</p>
            <input type="hidden" name="access_key" value="667654d6-8caa-4785-b767-fdb211281f18">
            <input type="hidden" name="subject" value="New enquiry from studiograta.in">
            <input type="hidden" name="from_name" value="Studio Grata website">
            <!-- Spam trap: hidden from people, bots tick it and get ignored -->
            <input type="checkbox" name="botcheck" class="contact__trap" tabindex="-1" autocomplete="off">
            <label>Name
              <input type="text" name="name" autocomplete="name" required>
            </label>
            <label>Email
              <input type="email" name="email" autocomplete="email" required>
            </label>
            <label>Phone <span>(optional)</span>
              <input type="tel" name="phone" autocomplete="tel">
            </label>
            <label>Your space
              <textarea name="message" rows="5" placeholder="What it is, where it is, and when you hope to begin" required></textarea>
            </label>
            <button class="button" type="submit">Send</button>
            <p class="contact__status" role="status"></p>
          </form>
        </details>
