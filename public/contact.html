<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact | Studio Grata</title>
  <meta name="description" content="Get in touch with Studio Grata, a Bengaluru based interior architecture studio.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page contact">
    <a class="wordmark" href="/" aria-label="Studio Grata home"></a>

    <div class="contact__inner">
      <section class="contact__details">
        <h1>Contact</h1>
        <p>Tell us about your space.</p>
        <ul>
          <li><a href="mailto:reach@studiograta.in">reach@studiograta.in</a></li>
          <li><a href="tel:+917899829886">+91 78998 29886</a></li>
        </ul>
      </section>

      <!-- Enquiry form: Web3Forms emails each enquiry to the address linked to the access key -->
      <form class="contact__form" method="post" action="https://api.web3forms.com/submit">
        <input type="hidden" name="access_key" value="667654d6-8caa-4785-b767-fdb211281f18">
        <input type="hidden" name="subject" value="New enquiry from studiograta.in">
        <input type="hidden" name="from_name" value="Studio Grata website">
        <!-- Spam trap: hidden from people, bots tick it and get ignored -->
        <input type="checkbox" name="botcheck" class="contact__trap" tabindex="-1" autocomplete="off">
        <label>Name
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label>Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>Phone <span>(optional)</span>
          <input type="tel" name="phone" autocomplete="tel">
        </label>
        <label>Enquiry
          <textarea name="message" rows="5" required></textarea>
        </label>
        <button class="button" type="submit">Send enquiry</button>
        <p class="contact__status" role="status"></p>
      </form>
    </div>
  </main>
  <script src="/contact.js"></script>
</body>
</html>
